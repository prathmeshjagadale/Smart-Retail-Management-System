{% extends "base.html" %}
{% block title %}Verify Exit Code{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-6 text-center">
  <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white mb-3">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-7 h-7">
      <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M7 9h4M7 13h10M7 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-slate-800">Verify customer exit code</h1>
  <p class="text-slate-500 text-sm mt-1 mb-6">Ask the customer for their 6-character exit code shown after payment.</p>

  <form method="POST" action="{{ url_for('cashier.lookup') }}" class="bg-white border border-slate-200 rounded-2xl shadow-card p-6">
    {% include "_csrf.html" %}
    <input type="text" name="exit_code" maxlength="6" required autofocus placeholder="A1B2C3"
           class="w-full text-center tracking-[0.4em] text-2xl font-extrabold uppercase rounded-lg border border-slate-300 px-3 py-4 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
           oninput="this.value = this.value.toUpperCase()">
    <button type="submit" class="w-full mt-4 py-3 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-bold">
      Verify order
    </button>
  </form>
</div>
{% endblock %}
