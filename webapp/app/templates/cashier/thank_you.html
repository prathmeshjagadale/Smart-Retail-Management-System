{% extends "base.html" %}
{% block title %}Verified{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="text-center mb-6">
    <div class="text-6xl mb-2">✅</div>
    <h1 class="text-2xl font-bold text-brand-700">Thank you for shopping with us!</h1>
    <p class="text-slate-500 text-sm mt-1">Order verified — customer may exit the store.</p>
  </div>

  {% include "_bill.html" %}

  <a href="{{ url_for('cashier.dashboard') }}"
     class="mt-6 w-full inline-block text-center py-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold">
    Verify next customer
  </a>
</div>
{% endblock %}
