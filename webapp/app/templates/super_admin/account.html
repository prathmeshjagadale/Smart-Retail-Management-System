{% extends "base.html" %}
{% block title %}My Account{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold text-slate-800 mb-1">My account</h1>
  <p class="text-slate-500 text-sm mb-6">Signed in as {{ current_user.username }}</p>

  <form method="POST" class="bg-white border border-slate-200 rounded-2xl shadow-card p-6 space-y-4">
    {% include "_csrf.html" %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Current password</label>
      <input type="password" name="current_password" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">New password</label>
      <input type="password" name="new_password" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Confirm new password</label>
      <input type="password" name="confirm_password" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold">
      Update password
    </button>
  </form>
</div>
{% endblock %}
