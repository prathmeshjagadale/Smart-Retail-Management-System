{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-6">
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-7 h-7">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M19 8v6M22 11h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-800">Create your account</h1>
    <p class="text-slate-500 text-sm mt-1">Shop hands-free with SmartShelf</p>
  </div>

  <form method="POST" class="bg-white border border-slate-200 rounded-2xl shadow-card p-6 space-y-4">
    {% include "_csrf.html" %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Full name</label>
      <input type="text" name="full_name" required value="{{ form.get('full_name','') }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
      <input type="text" name="username" required value="{{ form.get('username','') }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" required value="{{ form.get('email','') }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Phone <span class="text-slate-400 font-normal">(optional)</span></label>
      <input type="tel" name="phone" value="{{ form.get('phone','') }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Confirm</label>
        <input type="password" name="confirm_password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
    </div>
    <button type="submit"
            class="w-full py-2.5 rounded-lg bg-brand-600 text-white font-semibold hover:bg-brand-700 transition">
      Create account
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 mt-5">
    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-brand-700 font-semibold hover:underline">Sign in</a>
  </p>
</div>
{% endblock %}
